<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trenchcoons — Asset Forge</title>
  <style>
    html,body{margin:0;height:100%;background:#1d1d1d;overflow:hidden;font:12px/1.45 ui-monospace,Menlo,monospace;color:#d0d0d0}
    canvas{display:block;width:100vw;height:100vh}
    #hud{position:fixed;top:36px;left:252px;font:11px/1.45 ui-monospace,Menlo,monospace;
         color:#cfe3ef;background:#0b0d10a8;padding:7px 9px;border-radius:5px;
         white-space:pre;pointer-events:none;z-index:10;backdrop-filter:blur(6px)}
    body.shot #hud,body.shot #forge-chrome,body.shot #env-panel,body.shot #outliner{display:none!important}
    body[data-forge-mode="assets"] #hud{left:8px}
    #err{position:fixed;inset:0;display:none;place-items:center;padding:40px;
         font:13px/1.6 ui-monospace,monospace;color:#ff9a9a;background:#0b0d10;
         white-space:pre-wrap;z-index:99}

    /* Blender-ish top bar */
    #forge-chrome{position:fixed;top:0;left:0;right:0;height:32px;z-index:30;display:flex;gap:8px;align-items:center;
      padding:0 8px;background:#2b2b2b;border-bottom:1px solid #141414}
    .forge-mode{display:flex;gap:2px;background:#232323;padding:2px;border-radius:4px}
    .forge-mode button,.forge-tabs-biome button,.forge-actions button,.forge-mini,.forge-prop-tabs button{
      appearance:none;border:0;background:#3a3a3a;color:#ddd;padding:5px 9px;border-radius:3px;
      cursor:pointer;font:inherit}
    .forge-mode button.on,.forge-tabs-biome button.on,.forge-prop-tabs button.on{background:#4772b3;color:#fff}
    .forge-mode button:hover,.forge-tabs-biome button:hover,.forge-actions button:hover,.forge-prop-tabs button:hover{background:#4a4a4a}
    .forge-title{opacity:.65;margin-left:4px;letter-spacing:.04em}

    /* Outliner (left) + Properties (right) — Environments only */
    #outliner,#env-panel{
      position:fixed;top:32px;bottom:0;z-index:20;background:#303030;border-color:#1b1b1b;
      box-sizing:border-box;overflow:auto}
    #outliner{left:0;width:240px;border-right:1px solid #1b1b1b;padding:8px 0}
    #env-panel{right:0;width:min(380px,40vw);border-left:1px solid #1b1b1b;padding:0}
    body[data-forge-mode="assets"] #outliner,
    body[data-forge-mode="assets"] #env-panel{display:none}

    .ol-head,.prop-head{
      position:sticky;top:0;z-index:2;background:#383838;border-bottom:1px solid #1b1b1b;
      padding:7px 10px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;opacity:.85}
    .ol-section{margin:6px 0 2px;padding:4px 10px;font-size:10px;opacity:.55;text-transform:uppercase}
    .ol-item{
      display:block;width:100%;text-align:left;appearance:none;border:0;background:transparent;
      color:#d0d0d0;padding:5px 10px 5px 18px;font:inherit;cursor:pointer}
    .ol-item:hover{background:#3c3c3c}
    .ol-item.on{background:#4772b3;color:#fff}
    .ol-item .ol-meta{float:right;opacity:.55;font-size:10px}
    .ol-biome{padding-left:10px;font-weight:600}

    .forge-prop-tabs{display:flex;gap:2px;padding:6px;background:#2b2b2b;border-bottom:1px solid #1b1b1b;flex-wrap:wrap}
    .forge-prop-tabs button{flex:1 1 auto;padding:5px 6px;font-size:11px}
    .prop-body{padding:10px 12px 24px}

    .forge-section{margin:0 0 14px;padding:0 0 12px;border-bottom:1px solid #3a3a3a}
    .forge-section:last-child{border-bottom:0}
    .forge-section h3{margin:0 0 8px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;opacity:.75;
      display:flex;align-items:center;justify-content:space-between;gap:8px}
    .forge-section label{display:block;margin:6px 0;font-size:11px}
    .forge-section input[type="range"]{width:100%;accent-color:#4772b3}
    .forge-section select,.forge-section input[type="number"],.forge-section input[type="text"],.forge-section textarea{
      background:#1f1f1f;color:#ddd;border:1px solid #111;border-radius:3px;padding:4px 6px;font:inherit;width:100%;box-sizing:border-box}
    .forge-section textarea{min-height:64px;resize:vertical}
    .forge-colors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
    .forge-colors label{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
    .forge-colors input[type="color"]{width:100%;height:28px;padding:0;border:1px solid #111;border-radius:3px;background:transparent}
    .forge-tabs-biome{display:flex;flex-wrap:wrap;gap:4px}
    .forge-tabs-biome button{padding:5px 8px;font-size:11px}
    .forge-scatter-row{display:grid;grid-template-columns:1fr 52px 40px 40px 44px 22px;gap:3px;align-items:end;margin:6px 0}
    .forge-scatter-row label{margin:0;font-size:10px;opacity:.8}
    .forge-scatter-row input[type="number"]{width:100%;box-sizing:border-box}
    .forge-actions{display:flex;flex-wrap:wrap;gap:6px}
    .forge-actions button{flex:1 1 auto}
    .forge-mini{padding:2px 7px;font-size:11px}
    .forge-muted{opacity:.55;font-size:10px;line-height:1.4;margin:8px 0 0}
    .forge-muted code{color:#9fd0ff}
    .forge-export,.forge-diff{display:block;width:100%;min-height:100px;margin-top:8px;box-sizing:border-box;
      background:#1a1a1a;color:#cfe3ef;border:1px solid #111;border-radius:3px;padding:6px;
      font:10px/1.35 ui-monospace,Menlo,monospace;resize:vertical;white-space:pre-wrap}
    .forge-chip{display:inline-block;padding:2px 7px;margin:2px 3px 2px 0;border-radius:10px;background:#3a3a3a;font-size:10px}
    .forge-chip.on{background:#4772b3}
    .prompt-row{display:flex;gap:6px;align-items:stretch}
    .prompt-row textarea{flex:1;min-height:52px}
    .prompt-row button{align-self:stretch}
    [data-readout]{float:right;opacity:.7}
    .rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  </style>
</head>
<body data-forge-mode="assets">
  <div id="forge-chrome">
    <div class="forge-mode">
      <button type="button" data-mode="assets" class="on">Assets</button>
      <button type="button" data-mode="env">Environments</button>
    </div>
    <span class="forge-title">Forge · outliner · properties · prompt</span>
  </div>
  <aside id="outliner" hidden></aside>
  <canvas id="app"></canvas>
  <div id="hud"></div>
  <aside id="env-panel" hidden></aside>
  <div id="err"></div>
  <script type="module" src="/src/assets/forge/main.ts"></script>
</body>
</html>
